[project]
name = "maple-android-tools"
version = "0.1.0"
description = "Minimal MCP server to drive an Android phone precisely: accessibility selectors, adb primitives and Chrome DevTools for web content."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "uiautomator2>=3.0.0",
    "websocket-client>=1.7.0",
]

[project.scripts]
maple-android-tools = "maple_android_tools.server:main"

[project.urls]
Homepage = "https://github.com/MapleProjects/maple-android-tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maple_android_tools"]
